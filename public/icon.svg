<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle Circuit Grid Accents -->
  <path d="M64 160h60l40 40h40" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4,4" />
  <path d="M448 352h-60l-40-40h-40" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4,4" />
  <circle cx="164" cy="200" r="3" fill="#06b6d4" opacity="0.6" />
  <circle cx="348" cy="312" r="3" fill="#10b981" opacity="0.6" />

  <!-- Stylized Monogram "AG" -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M140 360 L230 150 L270 150 L310 240 L270 240 L250 196 L195 320 L270 320 L260 360 Z" fill="url(#cyanEmerald)" />
    <!-- Letter G overlay and tech cut -->
    <path d="M330 200 C370 200 400 230 400 280 C400 330 365 365 310 365 C260 365 240 340 240 340 L262 312 C262 312 278 328 310 328 C342 328 360 305 360 280 C360 255 342 238 315 238 C290 238 275 250 275 250 L275 212 C275 212 295 200 330 200 Z" fill="url(#cyanEmerald)" />
    <!-- G Crossbar -->
    <rect x="310" y="270" width="80" height="32" rx="6" fill="url(#cyanEmerald)" />
  </g>

  <!-- High-Tech Core Node -->
  <circle cx="350" cy="286" r="6" fill="#ffffff" />
  
  <!-- Subtitle Tag -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#94a3b8" letter-spacing="8" text-anchor="middle">DIGITAL</text>
</svg>
